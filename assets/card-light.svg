<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" fill="none" role="img" aria-label="Profile telemetry cards">
<title>Profile telemetry cards</title>
<defs>
<linearGradient id="cbt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0891b2"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
<filter id="cglow" x="-60%" y="-60%" width="220%" height="220%">
<feGaussianBlur stdDeviation="4" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<radialGradient id="camb" cx="0.2" cy="0.1" r="0.7"><stop offset="0" stop-color="#7c3aed" stop-opacity="0.14"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
</defs>

<text x="450" y="26" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','Courier New',monospace" font-size="12" letter-spacing="4" fill="url(#cbt)" text-anchor="middle" font-weight="700">TELEMETRY</text>
<rect width="900" height="240" fill="url(#camb)"/>
<g>
<rect x="28" y="46" width="193" height="150" rx="16" fill="#ffffff" stroke="#c9d0ee" stroke-width="1"/>
<rect x="28" y="46" width="193" height="150" rx="16" fill="url(#cardG0)" opacity="0.14"/>
<linearGradient id="cardG0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0891b2" stop-opacity="0.55"/><stop offset="1" stop-color="#0891b2" stop-opacity="0"/></linearGradient>
<rect x="28" y="46" width="193" height="3" rx="1.5" fill="#0891b2" opacity="0.85">
<animate attributeName="width" values="0;193" dur="1s" begin="0s" fill="freeze"/>
</rect>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
<text x="124.5" y="138" font-size="46" font-weight="800" fill="#0891b2" text-anchor="middle" filter="url(#cglow)">172
<animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.6s" fill="freeze"/>
</text>
<text x="124.5" y="168" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','Courier New',monospace" font-size="11.5" letter-spacing="3.4" fill="#4a5382" text-anchor="middle">COMMITS</text>
</g>
<circle cx="124.5" cy="72" r="3" fill="#0891b2" opacity="0.9">
<animate attributeName="opacity" values="0.9;0.15;0.9" dur="2s" repeatCount="indefinite"/>
</circle>
</g>
<g>
<rect x="241" y="46" width="193" height="150" rx="16" fill="#ffffff" stroke="#c9d0ee" stroke-width="1"/>
<rect x="241" y="46" width="193" height="150" rx="16" fill="url(#cardG1)" opacity="0.14"/>
<linearGradient id="cardG1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></linearGradient>
<rect x="241" y="46" width="193" height="3" rx="1.5" fill="#7c3aed" opacity="0.85">
<animate attributeName="width" values="0;193" dur="1s" begin="0.15s" fill="freeze"/>
</rect>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
<text x="337.5" y="138" font-size="46" font-weight="800" fill="#7c3aed" text-anchor="middle" filter="url(#cglow)">7
<animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.75s" fill="freeze"/>
</text>
<text x="337.5" y="168" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','Courier New',monospace" font-size="11.5" letter-spacing="3.4" fill="#4a5382" text-anchor="middle">REPOS</text>
</g>
<circle cx="337.5" cy="72" r="3" fill="#7c3aed" opacity="0.9">
<animate attributeName="opacity" values="0.9;0.15;0.9" dur="2.4s" repeatCount="indefinite"/>
</circle>
</g>
<g>
