<rect x="454" y="46" width="193" height="150" rx="16" fill="url(#cardG2)" opacity="0.14"/>
<linearGradient id="cardG2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#db2777" stop-opacity="0.55"/><stop offset="1" stop-color="#db2777" stop-opacity="0"/></linearGradient>
<rect x="454" y="46" width="193" height="3" rx="1.5" fill="#db2777" opacity="0.85">
<animate attributeName="width" values="0;193" dur="1s" begin="0.3s" fill="freeze"/>
