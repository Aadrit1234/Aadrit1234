<text x="550.5" y="138" font-size="46" font-weight="800" fill="#db2777" text-anchor="middle" filter="url(#cglow)">3
<animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.8999999999999999s" fill="freeze"/>
</text>
<text x="550.5" y="168" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','Courier New',monospace" font-size="11.5" letter-spacing="3.4" fill="#4a5382" text-anchor="middle">STARS</text>
</g>
<circle cx="550.5" cy="72" r="3" fill="#db2777" opacity="0.9">
<animate attributeName="opacity" values="0.9;0.15;0.9" dur="2.8s" repeatCount="indefinite"/>
</circle>
</g>
<g>
<rect x="667" y="46" width="193" height="150" rx="16" fill="#ffffff" stroke="#c9d0ee" stroke-width="1"/>
<rect x="667" y="46" width="193" height="150" rx="16" fill="url(#cardG3)" opacity="0.14"/>
<linearGradient id="cardG3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399" stop-opacity="0.55"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></linearGradient>
<rect x="667" y="46" width="193" height="3" rx="1.5" fill="#34d399" opacity="0.85">
<animate attributeName="width" values="0;193" dur="1s" begin="0.44999999999999996s" fill="freeze"/>
</rect>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
<text x="763.5" y="138" font-size="46" font-weight="800" fill="#34d399" text-anchor="middle" filter="url(#cglow)">8
<animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.0499999999999998s" fill="freeze"/>
</text>
<text x="763.5" y="168" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','Courier New',monospace" font-size="11.5" letter-spacing="3.4" fill="#4a5382" text-anchor="middle">LANGS</text>
