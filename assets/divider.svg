<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 40" width="900" height="40" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="d" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B7CFF" stop-opacity="0"/>
      <stop offset="35%" stop-color="#8B7CFF"/>
      <stop offset="60%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#FF4D8D" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="p" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="60" y="19" width="780" height="2" rx="1" fill="url(#d)">
    <animate attributeName="x" values="-120;180" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" dur="8s" repeatCount="indefinite"/>
  </rect>

  <circle cx="450" cy="20" r="7" fill="url(#p)">
    <animate attributeName="cx" values="180;720;180" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="r" values="5;8;5" dur="4s" repeatCount="indefinite"/>
  </circle>

  <circle cx="450" cy="20" r="2.6" fill="#E6F7FF"/>
</svg>
