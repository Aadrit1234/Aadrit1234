<svg xmlns="http://www.w3.org/2000/svg" width="850" height="60" viewBox="0 0 850 60" font-family="monospace">
  <defs>
    <linearGradient id="mrbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#04040c"/>
      <stop offset=".5" stop-color="#07101d"/>
      <stop offset="1" stop-color="#04040c"/>
    </linearGradient>
    <clipPath id="mrc"><rect width="850" height="60" rx="10"/></clipPath>
  </defs>
  <rect width="850" height="60" rx="10" fill="url(#mrbg)"/>
  <g clip-path="url(#mrc)">
    <!-- col 1 -->
    <g fill="#00ff9d" font-size="13" font-weight="700">
      <text x="30" y="0">1</text><text x="30" y="15">0</text><text x="30" y="30">λ</text><text x="30" y="45">0</text>
      <animateTransform attributeName="transform" type="translate" values="0 -60; 0 60" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".9;.15;.9" dur="3.2s" repeatCount="indefinite"/>
    </g>
    <!-- col 2 -->
    <g fill="#00ffe1" font-size="13" font-weight="700">
      <text x="130" y="0">/</text><text x="130" y="15">}</text><text x="130" y="30">0</text><text x="130" y="45">&gt;</text>
      <animateTransform attributeName="transform" type="translate" values="0 60; 0 -60" dur="3.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".2;.85;.2" dur="3.9s" repeatCount="indefinite"/>
    </g>
    <!-- col 3 -->
    <g fill="#c314ff" font-size="13" font-weight="700">
      <text x="230" y="0">0</text><text x="230" y="15">#</text><text x="230" y="30">1</text><text x="230" y="45">_</text>
      <animateTransform attributeName="transform" type="translate" values="0 -60; 0 60" dur="2.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".8;.12;.8" dur="2.7s" repeatCount="indefinite"/>
    </g>
    <!-- col 4 -->
    <g fill="#00ff9d" font-size="13" font-weight="700">
      <text x="330" y="0">λ</text><text x="330" y="15">1</text><text x="330" y="30">0</text><text x="330" y="45">&lt;</text>
      <animateTransform attributeName="transform" type="translate" values="0 60; 0 -60" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".15;.8;.15" dur="3.5s" repeatCount="indefinite"/>
    </g>
    <!-- col 5 -->
    <g fill="#2de1fc" font-size="13" font-weight="700">
      <text x="430" y="0">&gt;</text><text x="430" y="15">0</text><text x="430" y="30">{</text><text x="430" y="45">1</text>
      <animateTransform attributeName="transform" type="translate" values="0 -60; 0 60" dur="4.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".85;.15;.85" dur="4.1s" repeatCount="indefinite"/>
    </g>
    <!-- col 6 -->
    <g fill="#ff2bd6" font-size="13" font-weight="700">
      <text x="530" y="0">1</text><text x="530" y="15">/</text><text x="530" y="30">0</text><text x="530" y="45">}</text>
      <animateTransform attributeName="transform" type="translate" values="0 60; 0 -60" dur="3.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".2;.85;.2" dur="3.1s" repeatCount="indefinite"/>
    </g>
    <!-- col 7 -->
    <g fill="#00ff9d" font-size="13" font-weight="700">
      <text x="630" y="0">0</text><text x="630" y="15">λ</text><text x="630" y="30">1</text><text x="630" y="45">0</text>
      <animateTransform attributeName="transform" type="translate" values="0 -60; 0 60" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".85;.15;.85" dur="3.6s" repeatCount="indefinite"/>
    </g>
    <!-- col 8 -->
    <g fill="#ffd166" font-size="13" font-weight="700">
      <text x="730" y="0">#</text><text x="730" y="15">0</text><text x="730" y="30">1</text><text x="730" y="45">λ</text>
      <animateTransform attributeName="transform" type="translate" values="0 60; 0 -60" dur="2.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;.1;.7" dur="2.9s" repeatCount="indefinite"/>
    </g>
    <!-- center label -->
    <text x="425" y="37" text-anchor="middle" font-size="14" letter-spacing="6" fill="#aef4e6" font-weight="700" opacity=".9">◈ SYSTEMS ONLINE ◈</text>
  </g>
  <rect width="850" height="60" rx="10" fill="none" stroke="#00ff9d" stroke-opacity=".35" stroke-width="1.2"/>
</svg>
