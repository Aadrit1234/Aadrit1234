<svg xmlns="http://www.w3.org/2000/svg" width="850" height="120" viewBox="0 0 850 120" font-family="Consolas, monospace">
  <defs>
    <linearGradient id="achbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset=".5" stop-color="#0d0620"/>
      <stop offset="1" stop-color="#070b16"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="achGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="achclip"><rect x="1.5" y="1.5" width="847" height="117" rx="14"/></clipPath>
  </defs>

  <rect x="1.5" y="1.5" width="847" height="117" rx="14" fill="url(#achbg)"/>

  <g clip-path="url(#achclip)">
    <!-- chip 1 -->
    <g filter="url(#achGlow)">
      <rect x="30" y="30" width="185" height="60" rx="12" fill="#0a1128" stroke="#00ffe1" stroke-opacity=".7" stroke-width="1.6">
        <animate attributeName="stroke" values="#00ffe1;#c314ff;#00ffe1" dur="4s" repeatCount="indefinite"/>
      </rect>
      <text x="122" y="57" text-anchor="middle" font-size="17">🚀</text>
      <text x="122" y="78" text-anchor="middle" font-size="11" fill="#9fe8ff" letter-spacing="1.5">5 BUILDS SHIPPED</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" dur="3.4s" repeatCount="indefinite"/>
    </g>
    <!-- chip 2 -->
    <g filter="url(#achGlow)">
      <rect x="238" y="30" width="185" height="60" rx="12" fill="#0a1128" stroke="#ff2bd6" stroke-opacity=".7" stroke-width="1.6">
        <animate attributeName="stroke" values="#ff2bd6;#ffd166;#ff2bd6" dur="4.6s" repeatCount="indefinite"/>
      </rect>
      <text x="330" y="57" text-anchor="middle" font-size="17">⚔️</text>
      <text x="330" y="78" text-anchor="middle" font-size="11" fill="#9fe8ff" letter-spacing="1.5">FULL-STACK DEV</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" dur="3.4s" begin="0.6s" repeatCount="indefinite"/>
    </g>
    <!-- chip 3 -->
    <g filter="url(#achGlow)">
      <rect x="446" y="30" width="185" height="60" rx="12" fill="#0a1128" stroke="#ffd166" stroke-opacity=".7" stroke-width="1.6">
        <animate attributeName="stroke" values="#ffd166;#00ff9d;#ffd166" dur="4.2s" repeatCount="indefinite"/>
      </rect>
      <text x="538" y="57" text-anchor="middle" font-size="17">🛡️</text>
      <text x="538" y="78" text-anchor="middle" font-size="11" fill="#9fe8ff" letter-spacing="1.5">SECURITY FIRST</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" dur="3.4s" begin="1.2s" repeatCount="indefinite"/>
    </g>
    <!-- chip 4 -->
    <g filter="url(#achGlow)">
      <rect x="654" y="30" width="170" height="60" rx="12" fill="#0a1128" stroke="#00ff9d" stroke-opacity=".7" stroke-width="1.6">
        <animate attributeName="stroke" values="#00ff9d;#00ffe1;#00ff9d" dur="4.8s" repeatCount="indefinite"/>
      </rect>
      <text x="739" y="57" text-anchor="middle" font-size="17">🧠</text>
      <text x="739" y="78" text-anchor="middle" font-size="11" fill="#9fe8ff" letter-spacing="1.5">AI/ML EXPLORER</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" dur="3.4s" begin="1.8s" repeatCount="indefinite"/>
    </g>
    <!-- shine sweep -->
    <rect x="-200" y="1.5" width="140" height="117" fill="url(#shine)">
      <animate attributeName="x" values="-200;850" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="1.5" y="1.5" width="847" height="117" rx="14" fill="none" stroke="#8a2be2" stroke-opacity=".4" stroke-width="1.4"/>
</svg>
