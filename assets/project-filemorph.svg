<rect x="28" y="0" width="3" height="268" fill="#22d3ee" opacity="0.9">
<animate attributeName="opacity" values="0.35;1;0.35" dur="4s" repeatCount="indefinite"/>
</rect>
<g>
<rect x="366.4" y="26" width="75.6" height="20" rx="10" fill="#a855f7" opacity="0.14" stroke="#a855f7" stroke-opacity="0.5"/>
