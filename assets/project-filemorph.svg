<svg xmlns="http://www.w3.org/2000/svg" width="470" height="268" viewBox="0 0 470 268" fill="none" role="img" aria-label="filemorph card">
<title>filemorph card</title>
<defs>
<linearGradient id="pgt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.16"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
<filter id="pglow" x="-60%" y="-60%" width="220%" height="220%">
<feGaussianBlur stdDeviation="2.4" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>

<g>
<rect x="0.5" y="0.5" width="469" height="267" rx="18" fill="#0b0e20" stroke="#232b56" stroke-width="1"/>
