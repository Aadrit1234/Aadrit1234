<animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.32s" fill="freeze"/></text>
<text x="28" y="114" font-size="12.5" fill="undefined">(LibreOffice, pdf2docx, Sharp).
<animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.44s" fill="freeze"/></text>
</g>
