<svg xmlns="http://www.w3.org/2000/svg" width="900" height="56" viewBox="0 0 900 56" fill="none" role="img" aria-label="Section divider">
<title>Section divider</title>
<defs>
<linearGradient id="shg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0891b2"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
<filter id="shglow" x="-60%" y="-60%" width="220%" height="220%">
<feGaussianBlur stdDeviation="3" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>

<g>
<line x1="0" y1="28" x2="360" y2="28" stroke="url(#shg)" stroke-width="1.5" opacity="0.5">
<animate attributeName="x2" values="0;360" dur="1.1s" fill="freeze"/>
</line>
<line x1="540" y1="28" x2="900" y2="28" stroke="url(#shg)" stroke-width="1.5" opacity="0.5">
<animate attributeName="x1" values="900;540" dur="1.1s" fill="freeze"/>
</line>
<g transform="translate(450 28)">
<polygon points="-9,0 0,-9 9,0 0,9" fill="none" stroke="#0891b2" stroke-width="1.5" filter="url(#shglow)">
<animateTransform attributeName="transform" type="rotate" values="0;360" dur="14s" repeatCount="indefinite"/>
</polygon>
<circle cx="0" cy="0" r="2.5" fill="#7c3aed">
<animate attributeName="r" values="2;4.2;2" dur="2.6s" repeatCount="indefinite"/>
</circle>
</g>
</g>
</svg>
