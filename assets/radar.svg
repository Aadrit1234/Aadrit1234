<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-label="Orbiting stack radar showing front-end, back-end, infra and creative tech">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B7CFF"/>
      <stop offset="55%" stop-color="#22D3EE" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B7CFF"/><stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="ring2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#28C840"/>
    </linearGradient>
    <linearGradient id="ring3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFCB6B"/><stop offset="100%" stop-color="#FF4D8D"/>
    </linearGradient>
    <filter id="blurbig" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="dotglow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="4"/></filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .lbl { font-size: 12px; fill: #C7D2E4; }
      .ringtxt { font-size: 11.5px; letter-spacing: 2px; }
      @media (prefers-color-scheme: light) { .lbl { fill: #3C4759; } }
    </style>
  </defs>

  <circle cx="450" cy="310" r="190" fill="url(#core)" opacity="0.28" filter="url(#blurbig)">
    <animate attributeName="opacity" values="0.18;0.4;0.18" dur="6s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(450,310)">
    <circle r="70" fill="#0A0F1C" fill-opacity="0.85" stroke="#8B7CFF" stroke-opacity="0.45"/>
    <circle r="70" fill="none" stroke="#22D3EE" stroke-opacity="0.55" stroke-width="1.4" stroke-dasharray="10 16">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle r="84" fill="none" stroke="#FF4D8D" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="2 12">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="20s" repeatCount="indefinite"/>
    </circle>
    <text class="mono" y="-4" font-size="26" fill="#E9EEF8" text-anchor="middle" font-weight="700">AADRIT</text>
    <text class="mono ringtxt" y="18" fill="#22D3EE" text-anchor="middle">STACK</text>
    <circle r="92" fill="none" stroke="#8B7CFF" stroke-opacity="0.18" stroke-width="1"/>
  </g>

  <g transform="translate(450,310)">
    <circle r="118" fill="none" stroke="url(#ring1)" stroke-opacity="0.5" stroke-width="1.2" stroke-dasharray="26 18">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/>
    </circle>
    <g>
      <circle cx="0" cy="-118" r="5" fill="#8B7CFF" filter="url(#dotglow)"><animate attributeName="opacity" values="1;0.5;1" dur="3s" repeatCount="indefinite"/></circle>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="0" cy="-118" r="3.6" fill="#22D3EE">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" begin="-8s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text class="mono lbl" x="0" y="-128" font-size="11.5" text-anchor="middle" fill="#8B7CFF">FRONTEND</text>
  </g>

  <g transform="translate(450,310)">
    <circle r="162" fill="none" stroke="url(#ring2)" stroke-opacity="0.45" stroke-width="1.2" stroke-dasharray="34 26">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="22s" repeatCount="indefinite"/>
    </circle>
    <g>
      <circle cx="0" cy="-162" r="5" fill="#28C840" filter="url(#dotglow)"><animate attributeName="opacity" values="1;0.4;1" dur="4s" repeatCount="indefinite"/></circle>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="22s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="0" cy="-162" r="3.6" fill="#22D3EE">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="22s" begin="-11s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text class="mono lbl" x="0" y="-172" font-size="11.5" text-anchor="middle" fill="#28C840">BACKEND</text>
  </g>

  <g transform="translate(450,310)">
    <circle r="206" fill="none" stroke="url(#ring3)" stroke-opacity="0.4" stroke-width="1.2" stroke-dasharray="18 22">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
    </circle>
    <g>
      <circle cx="0" cy="-206" r="5" fill="#FF4D8D" filter="url(#dotglow)"><animate attributeName="opacity" values="1;0.45;1" dur="5s" repeatCount="indefinite"/></circle>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="0" cy="-206" r="3.6" fill="#FFCB6B">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" begin="-15s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text class="mono lbl" x="0" y="-216" font-size="11.5" text-anchor="middle" fill="#FF4D8D">INFRA</text>
  </g>

  <g transform="translate(450,310)">
    <circle r="248" fill="none" stroke="#22D3EE" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="4 16">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="42s" repeatCount="indefinite"/>
    </circle>
    <circle r="278" fill="none" stroke="#8B7CFF" stroke-opacity="0.16" stroke-width="1"/>
    <g>
      <circle cx="0" cy="-278" r="4.4" fill="#22D3EE" filter="url(#dotglow)">
        <animate attributeName="opacity" values="1;0.35;1" dur="6s" repeatCount="indefinite"/>
      </circle>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="42s" repeatCount="indefinite"/>
    </g>
    <text class="mono lbl" x="0" y="-288" font-size="11.5" text-anchor="middle" fill="#22D3EE">CREATIVE</text>
  </g>

  <!-- sweeping radar -->
  <g transform="translate(450,310)">
    <path d="M0 0 L0 -278 A278 278 0 0 1 196 -196 Z" fill="#22D3EE" opacity="0.09">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
