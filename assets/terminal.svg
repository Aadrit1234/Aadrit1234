<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="Terminal preview of Aadrit's stack: TypeScript, React, Vite, Node, Fastify, Postgres, Three.js, Python, Electron">
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0A0E1A"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B7CFF" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FF4D8D" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="glowf" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; }
    .line { opacity: 0; animation: typeIn .5s cubic-bezier(.22,1,.36,1) forwards; }
    .cur  { animation: blink 1.05s steps(1) infinite; }
    @keyframes typeIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
    @keyframes scrollLine { 0% { opacity: 0; transform: translateY(10px) } 12% { opacity: 1; transform: none } 88% { opacity: 1 } 100% { opacity: 0; transform: translateY(-8px) } }
    .scroll { animation: scrollLine 9s cubic-bezier(.22,1,.36,1) infinite; }
  </style>

  <g filter="url(#drop)">
    <rect x="6" y="6" width="888" height="458" rx="18" fill="url(#win)"/>
    <rect x="6.5" y="6.5" width="887" height="457" rx="17.5" fill="none" stroke="#2A3346"/>

    <path d="M6 24a18 18 0 0 1 18-18h852a18 18 0 0 1 18 18v26H6z" fill="#151B2B"/>
    <line x1="6" y1="50" x2="894" y2="50" stroke="#232B3D"/>

    <circle cx="34" cy="28" r="6.5" fill="#FF5F57"/>
    <circle cx="56" cy="28" r="6.5" fill="#FEBC2E"/>
    <circle cx="78" cy="28" r="6.5" fill="#28C840"/>
    <text class="mono" x="450" y="33" font-size="12.5" fill="#7C8AA5" text-anchor="middle" letter-spacing="0.6">aadrit — ~/stack — zsh</text>

    <rect x="20" y="66" width="860" height="26" rx="7" fill="#0D1424" stroke="#1E2740"/>
    <circle cx="36" cy="79" r="4.5" fill="#FF4D8D" filter="url(#glowf)"/>
    <text class="mono" x="50" y="84" font-size="13.5" fill="#FF7FB0">~/stack</text>
    <text class="mono" x="112" y="84" font-size="13.5" fill="#E6ECF7">$</text>
    <text class="mono" x="126" y="84" font-size="13.5" fill="#22D3EE">cat profile.ts</text>

    <g class="mono" font-size="13.5">
      <text class="line" x="44" y="120" fill="#5C6B85" style="animation-delay:.35s">// shipped, shipped, shipped</text>

      <text class="line" x="44" y="150" fill="#E6ECF7" style="animation-delay:.6s" xml:space="preserve"><tspan fill="#C792EA">export const</tspan><tspan> engineer = </tspan></text>

      <text class="line" x="56" y="178" style="animation-delay:.85s">
        <tspan fill="#E6ECF7">name</tspan><tspan fill="#89DDFF">:</tspan><tspan fill="#C3E88D"> "Aadrit"</tspan><tspan fill="#89DDFF">,</tspan>
      </text>
      <text class="line" x="56" y="202" style="animation-delay:1.05s">
        <tspan fill="#E6ECF7">role</tspan><tspan fill="#89DDFF">:</tspan><tspan fill="#C3E88D"> "full-stack engineer"</tspan><tspan fill="#89DDFF">,</tspan>
      </text>
      <text class="line" x="56" y="226" style="animation-delay:1.25s">
        <tspan fill="#E6ECF7">focus</tspan><tspan fill="#89DDFF">:</tspan><tspan fill="#C3E88D"> [ "realtime"</tspan><tspan fill="#89DDFF">,</tspan><tspan fill="#C3E88D"> "offline-first"</tspan><tspan fill="#89DDFF">,</tspan><tspan fill="#C3E88D"> "creative tooling" ],</tspan>
      </text>

      <text class="line" x="56" y="254" style="animation-delay:1.5s">
        <tspan fill="#E6ECF7">stack</tspan><tspan fill="#89DDFF">:</tspan><tspan fill="#C3E88D"> {</tspan>
      </text>

      <text class="line" x="72" y="278" style="animation-delay:1.7s">
        <tspan fill="#FFCB6B">langs</tspan><tspan fill="#89DDFF">:</tspan><tspan fill="#C3E88D"> [ "TypeScript"</tspan><tspan fill="#89DDFF">,</tspan><tspan fill="#C3E88D"> "JavaScript"</tspan><tspan fill="#89DDFF">,</tspan><tspan fill="#C3E88D"> "Python"</tspan><tspan fill="#89DDFF">,</tspan><tspan fill="#C3E88D"> "SQL" ],</tspan>
      </text>
      <text class="line" x="72" y="302" style="animation-delay:1.9s">
        <tspan fill="#FFCB6B">web</tspan><tspan fill="#89DDFF">:</tspan><tspan fill="#C3E88D"> [ "React"</tspan><tspan fill="#89DDFF">,</tspan><tspan fill="#C3E88D"> "Vite"</tspan><tspan fill="#89DDFF">,</tspan><tspan fill="#C3E88D"> "Three.js"</tspan><tspan fill="#89DDFF">,</tspan><tspan fill="#C3E88D"> "Tailwind" ],</tspan>
      </text>
      <text class="line" x="72" y="326" style="animation-delay:2.1s">
        <tspan fill="#FFCB6B">server</tspan><tspan fill="#89DDFF">:</tspan><tspan fill="#C3E88D"> [ "Node"</tspan><tspan fill="#89DDFF">,</tspan><tspan fill="#C3E88D"> "Fastify"</tspan><tspan fill="#89DDFF">,</tspan><tspan fill="#C3E88D"> "Postgres" ],</tspan>
      </text>
      <text class="line" x="72" y="350" style="animation-delay:2.3s">
        <tspan fill="#FFCB6B">desktop</tspan><tspan fill="#89DDFF">:</tspan><tspan fill="#C3E88D"> [ "Electron"</tspan><tspan fill="#89DDFF">,</tspan><tspan fill="#C3E88D"> "Tauri" ],</tspan>
      </text>
      <text class="line" x="56" y="374" style="animation-delay:2.5s">
        <tspan fill="#C3E88D">},</tspan>
      </text>

      <text class="line" x="56" y="402" style="animation-delay:2.8s">
        <tspan fill="#E6ECF7">shipIt</tspan><tspan fill="#89DDFF">:</tspan><tspan fill="#82AAFF"> (idea) </tspan><tspan fill="#89DDFF">=&gt;</tspan><tspan fill="#C3E88D"> idea </tspan><tspan fill="#89DDFF">&lt;</tspan><tspan fill="#C792EA">ship</tspan><tspan fill="#89DDFF">&gt;</tspan>
      </text>
    </g>

    <text class="mono scroll" x="44" y="430" font-size="13">
      <tspan fill="#28C840">●</tspan>
      <tspan fill="#7C8AA5"> now: building real-time rooms, print infra &amp; study tools</tspan>
    </text>

    <rect x="404" y="418" width="9" height="16" rx="1" fill="#22D3EE" class="cur"/>

    <rect x="6" y="6" width="888" height="2.5" rx="1.25" fill="url(#edge)">
      <animate attributeName="x" values="-40;880" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
