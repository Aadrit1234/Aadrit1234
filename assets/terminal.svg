<svg xmlns="http://www.w3.org/2000/svg" width="850" height="200" viewBox="0 0 850 200" font-family="Consolas, 'Fira Code', monospace">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0f1e"/>
      <stop offset="1" stop-color="#05070f"/>
    </linearGradient>
    <filter id="tGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tclip"><rect x="1.5" y="1.5" width="847" height="197" rx="12"/></clipPath>
  </defs>

  <rect x="1.5" y="1.5" width="847" height="197" rx="12" fill="url(#tbg)"/>

  <g clip-path="url(#tclip)">
    <!-- title bar -->
    <rect x="1.5" y="1.5" width="847" height="34" rx="12" fill="#101830"/>
    <rect x="1.5" y="22" width="847" height="14" fill="#101830"/>
    <circle cx="26" cy="18" r="6" fill="#ff5f56"><animate attributeName="opacity" values="1;.35;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="46" cy="18" r="6" fill="#ffbd2e"><animate attributeName="opacity" values=".4;1;.4" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="66" cy="18" r="6" fill="#27c93f"><animate attributeName="opacity" values="1;.35;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <text x="425" y="23" text-anchor="middle" font-size="12" fill="#8aa2c8">aadrit@mainframe: ~/portfolio — zsh</text>

    <!-- faint grid backdrop -->
    <g stroke="#1c2b52" stroke-opacity=".18">
      <line x1="0" y1="60" x2="850" y2="60"/><line x1="0" y1="90" x2="850" y2="90"/>
      <line x1="0" y1="120" x2="850" y2="120"/><line x1="0" y1="150" x2="850" y2="150"/>
      <line x1="0" y1="180" x2="850" y2="180"/>
    </g>

    <!-- typed command line 1 -->
    <g filter="url(#tGlow)">
      <text x="26" y="76" font-size="15" fill="#00ff9d" font-weight="700">➜  ~</text>
      <text x="80" y="76" font-size="15" fill="#e6f7ff">
        <tspan>whoami</tspan>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.35;0.38" dur="16s" repeatCount="indefinite"/>
      </text>
      <rect x="26" y="88" width="8" height="16" fill="#00ffe1">
        <animate attributeName="opacity" values="1;0" dur="0.9s" repeatCount="indefinite"/>
      </rect>
      <text x="80" y="101" font-size="14" fill="#9fe8ff">
        <tspan>aadrit — full-stack dev · security enthusiast · AI/ML tinkerer</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.12;0.18;0.5;0.55" dur="16s" repeatCount="indefinite"/>
      </text>
      <!-- line 2 -->
      <text x="26" y="130" font-size="15" fill="#00ff9d" font-weight="700">
        <tspan>➜  ~</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.38;0.44;0.86;0.9" dur="16s" repeatCount="indefinite"/>
      </text>
      <text x="80" y="130" font-size="15" fill="#e6f7ff">
        <tspan>cat mission.txt</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.42;0.5;0.86;0.9" dur="16s" repeatCount="indefinite"/>
      </text>
      <text x="80" y="155" font-size="14" fill="#ffd166">
        <tspan>Building secure, resilient &amp; intelligent systems — and breaking</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6;0.66;0.86;0.9" dur="16s" repeatCount="indefinite"/>
      </text>
      <text x="80" y="175" font-size="14" fill="#ffd166">
        <tspan>them first to understand them deeply.</tspan>
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.72;0.78;1" dur="16s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>

  <rect x="1.5" y="1.5" width="847" height="197" rx="12" fill="none" stroke="#2de1fc" stroke-opacity=".45" stroke-width="1.6">
    <animate attributeName="stroke" values="#2de1fc;#8a2be2;#00ff9d;#2de1fc" dur="8s" repeatCount="indefinite"/>
  </rect>
</svg>
