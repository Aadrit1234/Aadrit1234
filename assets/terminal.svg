<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="Animated terminal preview of Aadrit's stack">
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131A2B"/>
      <stop offset="100%" stop-color="#080C17"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B7CFF"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#FF4D8D"/>
    </linearGradient>
    <linearGradient id="prog" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B7CFF"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#28C840"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="gf" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
    <clipPath id="clipwin"><rect x="6" y="6" width="888" height="548" rx="18"/></clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; }
      .line { opacity: 0; animation: typeIn .5s cubic-bezier(.22,1,.36,1) forwards; }
      .cur  { animation: blink 1.05s steps(1) infinite; }
      @keyframes typeIn { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }
      @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes ticker { 0% { opacity: 0; transform: translateY(8px) } 10% { opacity: 1; transform: none } 90% { opacity: 1 } 100% { opacity: 0; transform: translateY(-6px) } }
      .tk { animation: ticker 7s cubic-bezier(.22,1,.36,1) infinite; }
      .spin { animation: spin 4s linear infinite; transform-origin: center; transform-box: fill-box; }
      .pulse { animation: blink 2s ease-in-out infinite; }
      .shake { animation: typeIn .6s cubic-bezier(.22,1,.36,1) both; }
    </style>
  </defs>

  <g filter="url(#drop)">
    <rect x="6" y="6" width="888" height="548" rx="18" fill="url(#win)"/>
    <rect x="6.5" y="6.5" width="887" height="547" rx="17.5" fill="none" stroke="#2A3346"/>

    <g clip-path="url(#clipwin)">
      <rect x="6" y="50" width="888" height="504" fill="none"/>
      <!-- scanline overlay -->
      <rect x="-260" y="50" width="200" height="504" fill="url(#scan)">
        <animate attributeName="x" values="-260;1000" dur="8s" repeatCount="indefinite"/>
      </rect>
    </g>

    <path d="M6 24a18 18 0 0 1 18-18h852a18 18 0 0 1 18 18v26H6z" fill="#161D2E"/>
    <line x1="6" y1="50" x2="894" y2="50" stroke="#232B3D"/>

    <circle cx="34" cy="28" r="6.5" fill="#FF5F57"/>
    <circle cx="56" cy="28" r="6.5" fill="#FEBC2E"/>
    <circle cx="78" cy="28" r="6.5" fill="#28C840"/>
    <text class="mono" x="450" y="33" font-size="12.5" fill="#7C8AA5" text-anchor="middle" letter-spacing="0.6">aadrit — ~/stack — zsh — 92x28</text>
    <circle class="pulse" cx="862" cy="28" r="4" fill="#28C840"/>

    <rect x="20" y="66" width="860" height="26" rx="7" fill="#0D1424" stroke="#1E2740"/>
    <circle cx="36" cy="79" r="4.5" fill="#FF4D8D" filter="url(#gf)"/>
    <text class="mono" x="50" y="84" font-size="13.5" fill="#FF7FB0">~/stack</text>
    <text class="mono" x="112" y="84" font-size="13.5" fill="#E6ECF7">$</text>
    <text class="mono" x="126" y="84" font-size="13.5" fill="#22D3EE">cat profile.ts</text>

    <g class="mono" font-size="13.5">
      <text class="line" x="44" y="122" fill="#5C6B85" style="animation-delay:.3s">// what I reach for</text>

      <text class="line" x="44" y="154" fill="#E6ECF7" style="animation-delay:.55s" xml:space="preserve"><tspan fill="#C792EA">export const</tspan><tspan> engineer = {</tspan></text>

      <text class="line" x="56" y="182" xml:space="preserve" style="animation-delay:.8s"><tspan fill="#E6ECF7">name </tspan><tspan fill="#89DDFF">: </tspan><tspan fill="#C3E88D">"Aadrit"</tspan><tspan fill="#89DDFF">,</tspan></text>
      <text class="line" x="56" y="206" xml:space="preserve" style="animation-delay:1s"><tspan fill="#E6ECF7">role </tspan><tspan fill="#89DDFF">: </tspan><tspan fill="#C3E88D">"full-stack engineer"</tspan><tspan fill="#89DDFF">,</tspan></text>
      <text class="line" x="56" y="230" xml:space="preserve" style="animation-delay:1.2s"><tspan fill="#E6ECF7">focus </tspan><tspan fill="#89DDFF">: </tspan><tspan fill="#C3E88D">[ "realtime"</tspan><tspan fill="#89DDFF">,</tspan><tspan fill="#C3E88D"> "offline-first"</tspan><tspan fill="#89DDFF">,</tspan><tspan fill="#C3E88D"> "creative tooling" ],</tspan></text>

      <text class="line" x="56" y="258" fill="#C3E88D" style="animation-delay:1.45s">{</text>

      <text class="line" x="72" y="284" xml:space="preserve" style="animation-delay:1.65s"><tspan fill="#FFCB6B">langs </tspan><tspan fill="#89DDFF">: [ </tspan><tspan fill="#C3E88D">"TypeScript"</tspan><tspan fill="#89DDFF">, </tspan><tspan fill="#C3E88D">"JavaScript"</tspan><tspan fill="#89DDFF">, </tspan><tspan fill="#C3E88D">"Python"</tspan><tspan fill="#89DDFF">, </tspan><tspan fill="#C3E88D">"Rust"</tspan><tspan fill="#89DDFF">, </tspan><tspan fill="#C3E88D">"Go"</tspan><tspan fill="#89DDFF"> ],</tspan></text>
      <text class="line" x="72" y="308" xml:space="preserve" style="animation-delay:1.85s"><tspan fill="#FFCB6B">web </tspan><tspan fill="#89DDFF">: [ </tspan><tspan fill="#C3E88D">"React"</tspan><tspan fill="#89DDFF">, </tspan><tspan fill="#C3E88D">"Next"</tspan><tspan fill="#89DDFF">, </tspan><tspan fill="#C3E88D">"Vite"</tspan><tspan fill="#89DDFF">, </tspan><tspan fill="#C3E88D">"Three.js"</tspan><tspan fill="#89DDFF">, </tspan><tspan fill="#C3E88D">"Tailwind" ],</tspan></text>
      <text class="line" x="72" y="332" xml:space="preserve" style="animation-delay:2.05s"><tspan fill="#FFCB6B">server </tspan><tspan fill="#89DDFF">: [ </tspan><tspan fill="#C3E88D">"Node"</tspan><tspan fill="#89DDFF">, </tspan><tspan fill="#C3E88D">"Fastify"</tspan><tspan fill="#89DDFF">, </tspan><tspan fill="#C3E88D">"GraphQL"</tspan><tspan fill="#89DDFF">, </tspan><tspan fill="#C3E88D">"Postgres"</tspan><tspan fill="#89DDFF">, </tspan><tspan fill="#C3E88D">"Redis" ],</tspan></text>
      <text class="line" x="72" y="356" xml:space="preserve" style="animation-delay:2.25s"><tspan fill="#FFCB6B">desktop </tspan><tspan fill="#89DDFF">: [ </tspan><tspan fill="#C3E88D">"Electron"</tspan><tspan fill="#89DDFF">, </tspan><tspan fill="#C3E88D">"Tauri"</tspan><tspan fill="#89DDFF">, </tspan><tspan fill="#C3E88D">".NET" ],</tspan></text>
      <text class="line" x="72" y="380" xml:space="preserve" style="animation-delay:2.45s"><tspan fill="#FFCB6B">infra </tspan><tspan fill="#89DDFF">: [ </tspan><tspan fill="#C3E88D">"Docker"</tspan><tspan fill="#89DDFF">, </tspan><tspan fill="#C3E88D">"GH Actions"</tspan><tspan fill="#89DDFF">, </tspan><tspan fill="#C3E88D">"AWS"</tspan><tspan fill="#89DDFF">, </tspan><tspan fill="#C3E88D">"Cloudflare" ],</tspan></text>
      <text class="line" x="72" y="404" xml:space="preserve" style="animation-delay:2.65s"><tspan fill="#FFCB6B">ai </tspan><tspan fill="#89DDFF">: [ </tspan><tspan fill="#C3E88D">"PyTorch"</tspan><tspan fill="#89DDFF">, </tspan><tspan fill="#C3E88D">"Ollama"</tspan><tspan fill="#89DDFF">, </tspan><tspan fill="#C3E88D">"WebGPU" ],</tspan></text>

      <text class="line" x="56" y="430" fill="#C3E88D" style="animation-delay:2.9s">};</text>

      <text class="line" x="44" y="458" xml:space="preserve" style="animation-delay:3.2s"><tspan fill="#E6ECF7">shipIt</tspan><tspan fill="#89DDFF">: (</tspan><tspan fill="#82AAFF">idea</tspan><tspan fill="#89DDFF">) =&gt; </tspan><tspan fill="#C3E88D">idea </tspan><tspan fill="#89DDFF">&lt;</tspan><tspan fill="#C792EA">ship</tspan><tspan fill="#89DDFF">&gt;</tspan></text>
    </g>

    <rect x="20" y="474" width="860" height="5" rx="2.5" fill="#1A2334"/>
    <rect x="20" y="474" width="0" height="5" rx="2.5" fill="url(#prog)">
      <animate attributeName="width" values="0;120;300;470;640;760;860" keyTimes="0;0.12;0.28;0.45;0.62;0.8;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text class="mono" x="20" y="500" font-size="11.5" fill="#5C6B85">building</text>
    <text class="mono" x="880" y="500" font-size="11.5" fill="#28C840" text-anchor="end">100%</text>

    <text class="mono tk" x="44" y="524" font-size="12.5">
      <tspan fill="#28C840">●</tspan><tspan fill="#7C8AA5"> realtime rooms / print infra / study tools / 3D experiments</tspan>
    </text>

    <rect x="404" y="514" width="9" height="15" rx="1" fill="#22D3EE" class="cur"/>

    <g transform="translate(846,516)">
      <circle class="spin" r="11" fill="none" stroke="#22D3EE" stroke-opacity="0.35" stroke-width="1.6" stroke-dasharray="14 10"/>
      <circle r="3.4" fill="#22D3EE"><animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
    </g>

    <rect x="6" y="6" width="888" height="2.5" rx="1.25" fill="url(#edge)">
      <animate attributeName="x" values="-40;880" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
