<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="Featured projects: Conduit, PrintBridge, FormulaVault, Prompt Forge">
  <defs>
    <linearGradient id="c1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8B7CFF"/><stop offset="100%" stop-color="#22D3EE"/></linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#28C840"/></linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FF4D8D"/><stop offset="100%" stop-color="#FFCB6B"/></linearGradient>
    <linearGradient id="c4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFCB6B"/><stop offset="100%" stop-color="#8B7CFF"/></linearGradient>
    <filter id="cdrop" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/></filter>
    <filter id="cglow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="3.2"/></filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; }
      .sans { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      @keyframes breathe { 0%,100% { opacity:.35 } 50% { opacity:1 } }
      @keyframes spin { to { transform: rotate(360deg) } }
      @keyframes shimmer { 0% { opacity:0 } 50% { opacity:.8 } 100% { opacity:0 } }
      .breathe { animation: breathe 3.6s ease-in-out infinite; }
      .spin { animation: spin 9s linear infinite; }
      @media (prefers-color-scheme: dark) {
        .cardbg { fill: #0A0F1C; fill-opacity: 0.78; stroke-opacity: 0.16; }
        .dt { fill: #A6B3C9; }
        .st { fill: #6E7B94; }
      }
      @media (prefers-color-scheme: light) {
        .cardbg { fill: #FFFFFF; fill-opacity: 0.86; stroke-opacity: 0.22; }
        .dt { fill: #46536B; }
        .st { fill: #6C7A90; }
      }
    </style>
  </defs>

  <g filter="url(#cdrop)">
    <rect class="cardbg" x="30" y="16" width="408" height="212" rx="18" fill="#0A0F1C" fill-opacity="0.78" stroke="#8B9BB4" stroke-opacity="0.16"/>
    <rect x="30" y="16" width="408" height="3.5" rx="1.75" fill="url(#c1)"/>
    <circle class="breathe" cx="54" cy="50" r="5" fill="#8B7CFF"/>
    <text class="mono" x="70" y="56" font-size="20" font-weight="700" fill="#E9EEF8">conduit</text>
    <text class="mono st" x="410" y="56" font-size="12" text-anchor="end" fill="#6E7B94">TS</text>
    <text class="sans dt" x="50" y="92" font-size="12.5" fill="#A6B3C9">E2E-encrypted realtime rooms: chat, folders,</text>
    <text class="sans dt" x="50" y="112" font-size="12.5" fill="#A6B3C9">WebRTC file transfer, Postgres-backed.</text>
    <rect x="50" y="132" width="368" height="6" rx="3" fill="#8B7CFF" fill-opacity="0.2"/>
    <rect x="50" y="132" width="0" height="6" rx="3" fill="url(#c1)">
      <animate attributeName="width" values="0;120;250;368" keyTimes="0;0.35;0.7;1" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="50" y="152" width="368" height="6" rx="3" fill="#22D3EE" fill-opacity="0.2"/>
    <rect x="50" y="152" width="0" height="6" rx="3" fill="url(#c1)">
      <animate attributeName="width" values="0;200;330;368" keyTimes="0;0.3;0.65;1" dur="4s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
    <text class="mono st" x="50" y="196" font-size="11" fill="#6E7B94">React 19 / Vite / Three.js / Fastify</text>
    <g transform="translate(402,196)">
      <circle class="spin" r="13" fill="none" stroke="#8B7CFF" stroke-opacity="0.5" stroke-width="1.4" stroke-dasharray="4 8"/>
      <circle r="3" fill="#8B7CFF"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
    </g>
    <rect x="30" y="16" width="408" height="212" rx="18" fill="none" stroke="#8B7CFF" stroke-opacity="0.35" stroke-width="1.2">
      <animate attributeName="stroke-opacity" values="0.35;0.05;0.35" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g filter="url(#cdrop)">
    <rect class="cardbg" x="462" y="16" width="408" height="212" rx="18" fill="#0A0F1C" fill-opacity="0.78" stroke="#8B9BB4" stroke-opacity="0.16"/>
    <rect x="462" y="16" width="408" height="3.5" rx="1.75" fill="url(#c2)"/>
    <circle class="breathe" cx="486" cy="50" r="5" fill="#22D3EE" style="animation-delay:.5s"/>
    <text class="mono" x="502" y="56" font-size="20" font-weight="700" fill="#E9EEF8">printbridge</text>
    <text class="mono st" x="842" y="56" font-size="12" text-anchor="end" fill="#6E7B94">JS</text>
    <text class="sans dt" x="482" y="92" font-size="12.5" fill="#A6B3C9">Self-hosted print infra: 2 sites, 1 printer,</text>
    <text class="sans dt" x="482" y="112" font-size="12.5" fill="#A6B3C9">3 desktop apps, licences, token queue.</text>
    <rect x="482" y="132" width="368" height="6" rx="3" fill="#22D3EE" fill-opacity="0.2"/>
    <rect x="482" y="132" width="0" height="6" rx="3" fill="url(#c2)">
      <animate attributeName="width" values="0;90;210;368" keyTimes="0;0.3;0.65;1" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="482" y="152" width="368" height="6" rx="3" fill="#28C840" fill-opacity="0.2"/>
    <rect x="482" y="152" width="0" height="6" rx="3" fill="url(#c2)">
      <animate attributeName="width" values="0;160;280;368" keyTimes="0;0.35;0.7;1" dur="4s" begin="0.4s" repeatCount="indefinite"/>
    </rect>
    <text class="mono st" x="482" y="196" font-size="11" fill="#6E7B94">Node / Electron / Express / Render</text>
    <g transform="translate(834,196)">
      <circle class="spin" r="13" fill="none" stroke="#22D3EE" stroke-opacity="0.5" stroke-width="1.4" stroke-dasharray="4 8" style="animation-duration:7s;animation-direction:reverse"/>
      <circle r="3" fill="#22D3EE"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
    </g>
    <rect x="462" y="16" width="408" height="212" rx="18" fill="none" stroke="#22D3EE" stroke-opacity="0.3" stroke-width="1.2">
      <animate attributeName="stroke-opacity" values="0.3;0.05;0.3" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g filter="url(#cdrop)">
    <rect class="cardbg" x="30" y="242" width="408" height="212" rx="18" fill="#0A0F1C" fill-opacity="0.78" stroke="#8B9BB4" stroke-opacity="0.16"/>
    <rect x="30" y="242" width="408" height="3.5" rx="1.75" fill="url(#c3)"/>
    <circle class="breathe" cx="54" cy="276" r="5" fill="#FF4D8D" style="animation-delay:1s"/>
    <text class="mono" x="70" y="282" font-size="20" font-weight="700" fill="#E9EEF8">FormulaVault</text>
    <text class="mono st" x="410" y="282" font-size="12" text-anchor="end" fill="#6E7B94">HTML</text>
    <text class="sans dt" x="50" y="318" font-size="12.5" fill="#A6B3C9">Offline-first study app: 833 cards, 62 chapters,</text>
    <text class="sans dt" x="50" y="338" font-size="12.5" fill="#A6B3C9">AI tutor, flashcards, revision sheets.</text>
    <rect x="50" y="358" width="368" height="6" rx="3" fill="#FF4D8D" fill-opacity="0.2"/>
    <rect x="50" y="358" width="0" height="6" rx="3" fill="url(#c3)">
      <animate attributeName="width" values="0;150;290;368" keyTimes="0;0.35;0.7;1" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="50" y="378" width="368" height="6" rx="3" fill="#FFCB6B" fill-opacity="0.2"/>
    <rect x="50" y="378" width="0" height="6" rx="3" fill="url(#c3)">
      <animate attributeName="width" values="0;220;340;368" keyTimes="0;0.3;0.65;1" dur="4s" begin="0.5s" repeatCount="indefinite"/>
    </rect>
    <text class="mono st" x="50" y="422" font-size="11" fill="#6E7B94">Zero deps / Zero build / MathJax / localStorage</text>
    <g transform="translate(402,422)">
      <circle class="spin" r="13" fill="none" stroke="#FF4D8D" stroke-opacity="0.5" stroke-width="1.4" stroke-dasharray="4 8" style="animation-duration:11s"/>
      <circle r="3" fill="#FF4D8D"><animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/></circle>
    </g>
    <rect x="30" y="242" width="408" height="212" rx="18" fill="none" stroke="#FF4D8D" stroke-opacity="0.3" stroke-width="1.2">
      <animate attributeName="stroke-opacity" values="0.3;0.05;0.3" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g filter="url(#cdrop)">
    <rect class="cardbg" x="462" y="242" width="408" height="212" rx="18" fill="#0A0F1C" fill-opacity="0.78" stroke="#8B9BB4" stroke-opacity="0.16"/>
    <rect x="462" y="242" width="408" height="3.5" rx="1.75" fill="url(#c4)"/>
    <circle class="breathe" cx="486" cy="276" r="5" fill="#FFCB6B" style="animation-delay:1.5s"/>
    <text class="mono" x="502" y="282" font-size="20" font-weight="700" fill="#E9EEF8">prompt-forge</text>
    <text class="mono st" x="842" y="282" font-size="12" text-anchor="end" fill="#6E7B94">JS</text>
    <text class="sans dt" x="482" y="318" font-size="12.5" fill="#A6B3C9">Plain language in, structured prompt out.</text>
    <text class="sans dt" x="482" y="338" font-size="12.5" fill="#A6B3C9">Five AI backends, depth control, history.</text>
    <rect x="482" y="358" width="368" height="6" rx="3" fill="#FFCB6B" fill-opacity="0.2"/>
    <rect x="482" y="358" width="0" height="6" rx="3" fill="url(#c4)">
      <animate attributeName="width" values="0;110;240;368" keyTimes="0;0.35;0.7;1" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="482" y="378" width="368" height="6" rx="3" fill="#8B7CFF" fill-opacity="0.2"/>
    <rect x="482" y="378" width="0" height="6" rx="3" fill="url(#c4)">
      <animate attributeName="width" values="0;180;300;368" keyTimes="0;0.3;0.65;1" dur="4s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
    <text class="mono st" x="482" y="422" font-size="11" fill="#6E7B94">React / Express / OpenRouter / Gemini</text>
    <g transform="translate(834,422)">
      <circle class="spin" r="13" fill="none" stroke="#FFCB6B" stroke-opacity="0.5" stroke-width="1.4" stroke-dasharray="4 8" style="animation-duration:8s;animation-direction:reverse"/>
      <circle r="3" fill="#FFCB6B"><animate attributeName="opacity" values="1;0.3;1" dur="3.2s" repeatCount="indefinite"/></circle>
    </g>
    <rect x="462" y="242" width="408" height="212" rx="18" fill="none" stroke="#FFCB6B" stroke-opacity="0.3" stroke-width="1.2">
      <animate attributeName="stroke-opacity" values="0.3;0.05;0.3" dur="4.2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
